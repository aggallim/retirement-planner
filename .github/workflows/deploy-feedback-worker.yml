# Deploys the feedback relay Worker (tools/feedback/worker) to Cloudflare.
# intent/026 (2026-09-24 addendum). Setup and secrets: tools/feedback/README.md.
name: Deploy feedback Worker

on:
  push:
    branches:
      - main
    paths:
      - 'tools/feedback/worker/**'
      - '.github/workflows/deploy-feedback-worker.yml'
  workflow_dispatch:

concurrency:
  group: deploy-feedback-worker
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tools/feedback/worker
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      FEEDBACK_GITHUB_TOKEN: ${{ secrets.FEEDBACK_GITHUB_TOKEN }}
      KV_TITLE: retirement-planner-feedback-counters
      WRANGLER_SEND_METRICS: 'false'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check secrets are set
        run: |
          missing=0
          for v in CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID FEEDBACK_GITHUB_TOKEN; do
            if [ -z "${!v}" ]; then echo "::error::Repo secret $v is not set (see tools/feedback/README.md)"; missing=1; fi
          done
          exit $missing

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Run Worker tests
        working-directory: .
        run: node tests/test-feedback-worker.mjs

      - name: Find or create the KV namespace
        run: |
          set -o pipefail
          api="https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/storage/kv/namespaces"
          auth="Authorization: Bearer $CLOUDFLARE_API_TOKEN"
          if ! list=$(curl -fsS -H "$auth" "$api?per_page=100"); then
            echo "::error::Cloudflare refused the KV request. Check CLOUDFLARE_API_TOKEN (the token value, from the 'Edit Cloudflare Workers' template) and CLOUDFLARE_ACCOUNT_ID."
            exit 1
          fi
          id=$(jq -r --arg t "$KV_TITLE" '.result[] | select(.title == $t) | .id' <<<"$list" | head -n1)
          if [ -z "$id" ]; then
            if ! created=$(curl -fsS -X POST -H "$auth" -H 'Content-Type: application/json' \
                -d "{\"title\":\"$KV_TITLE\"}" "$api"); then
              echo "::error::Couldn't create the KV namespace $KV_TITLE"
              exit 1
            fi
            id=$(jq -r '.result.id' <<<"$created")
            echo "Created KV namespace $KV_TITLE"
          fi
          if [ -z "$id" ] || [ "$id" = "null" ]; then
            echo "::error::No KV namespace id for $KV_TITLE"
            exit 1
          fi
          sed -i "s/__FEEDBACK_KV_ID__/$id/" wrangler.toml

      - name: Deploy
        run: npx --yes wrangler@4 deploy

      - name: Set the Worker's GitHub token
        run: printf '%s' "$FEEDBACK_GITHUB_TOKEN" | npx --yes wrangler@4 secret put GITHUB_TOKEN

      - name: Print the Worker URL and check it answers
        run: |
          sub=$(curl -fsS -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/subdomain" | jq -r '.result.subdomain')
          url="https://retirement-planner-feedback.$sub.workers.dev"
          echo "Worker URL: $url"
          echo "### Worker URL: $url" >> "$GITHUB_STEP_SUMMARY"
          for i in 1 2 3 4 5 6; do
            if curl -fsS "$url/health"; then echo; exit 0; fi
            sleep 10
          done
          echo "::error::$url/health did not answer"; exit 1
